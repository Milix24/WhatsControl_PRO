<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsControl PRO - Dashboard Elite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="badge">WHATSCONTROL PRO</div>
            <h1>Panel de Control 🚀</h1>
            <p>Gestiona prospectos y visualiza tu historial de ventas.</p>
        </header>

        <div class="dashboard-grid">
            <div class="dash-item total">
                <span class="label">Total</span>
                <span id="totalStats" class="number">0</span>
            </div>
            <div class="dash-item process">
                <span class="label">Proceso</span>
                <span id="processStats" class="number">0</span>
            </div>
            <div class="dash-item closed">
                <span class="label">Ventas</span>
                <span id="closedStats" class="number">0</span>
            </div>
            <div class="dash-item lost">
                <span class="label">Seguimiento</span>
                <span id="lostStats" class="number">0</span>
            </div>
        </div>

        <section class="form-section">
            <div class="input-group">
                <input type="text" id="clientName" placeholder="Nombre completo del cliente">
                <input type="number" id="clientPhone" placeholder="WhatsApp (Ej: 56912345678)">
            </div>
            <select id="status">
                <option value="Nuevo">📩 Nuevo Prospecto</option>
                <option value="Interesado">🔥 Interesado</option>
                <option value="Pendiente">🟡 Pendiente</option>
                <option value="No Respondio">🔴 No respondió</option>
                <option value="Cliente">🟢 Venta Cerrada ✅</option>
            </select>
            <button id="mainBtn" onclick="addClient()">Registrar Cliente</button>
        </section>

        <div class="tools-row">
            <div class="search-wrapper">
                <input type="text" id="searchInput" onkeyup="render()" placeholder="🔍 Buscar nombre...">
            </div>
            <select id="filterStatus" onchange="render()" class="filter-select">
                <option value="Todos">📂 Todos</option>
                <option value="Nuevo">📩 Nuevos</option>
                <option value="Interesado">🔥 Interesados</option>
                <option value="Pendiente">🟡 Pendientes</option>
                <option value="No Respondio">🔴 Sin Respuesta</option>
                <option value="Cliente">🟢 Clientes</option>
            </select>
            <button class="btn-export" onclick="exportToCSV()" title="Descargar Excel">📊 Exportar</button>
        </div>

        <section class="list-section">
            <h2 class="list-title">Mis Clientes</h2>
            <div id="clientList"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
